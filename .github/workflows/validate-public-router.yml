name: Validate public router

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "info_for_ai/**"
      - "manifests/source_parity.csv"
      - "tests/test_public_router.py"
      - ".github/workflows/validate-public-router.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "info_for_ai/**"
      - "manifests/source_parity.csv"
      - "tests/test_public_router.py"
      - ".github/workflows/validate-public-router.yml"

permissions:
  contents: read

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source indices and gates
        run: python -m unittest discover -s tests -p "test_public_router.py" -v
