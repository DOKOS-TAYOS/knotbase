name: Validate public router

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "BOOTSTRAP.md"
      - "config/**"
      - "maintenance_for_ai/**"
      - "info_for_ai/**"
      - "manifests/source_parity.csv"
      - "tests/test_public_router*.py"
      - ".github/workflows/validate-public-router.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "BOOTSTRAP.md"
      - "config/**"
      - "maintenance_for_ai/**"
      - "info_for_ai/**"
      - "manifests/source_parity.csv"
      - "tests/test_public_router*.py"
      - ".github/workflows/validate-public-router.yml"

permissions:
  contents: read

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate full installed target tree
        run: python maintenance_for_ai/validation/validate.py
